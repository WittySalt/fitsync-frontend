# Frontend continuous deployment to AWS S3 + CloudFront (production).
#
# Reuses the artifact produced by the `build` job in .gitlab-ci.yml, so no
# second build is needed. The deploy is a MANUAL job that only appears on
# `main` pipelines: merge to main -> CI runs -> click "deploy_production".
#
# Required GitLab CI/CD variables (Settings > CI/CD > Variables):
#   AWS_ROLE_ARN               IAM role ARN with the GitLab OIDC trust (fitsync-frontend-deploy)
#   AWS_REGION                 e.g. ap-southeast-1
#   S3_BUCKET_PROD             target S3 bucket name (static site origin)
#   CLOUDFRONT_DISTRIBUTION_ID CloudFront distribution id (optional; invalidation skipped if unset)

deploy_production:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: build
      artifacts: true
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  environment:
    name: production
    url: https://d26vi6hikexzev.cloudfront.net
  before_script:
    - apk add --no-cache bash python3 py3-pip
    - pip install --break-system-packages awscli
    - >
      aws_sts_output=$(aws sts assume-role-with-web-identity
      --role-arn "$AWS_ROLE_ARN"
      --role-session-name "gitlab-${CI_PROJECT_ID}-${CI_PIPELINE_ID}"
      --web-identity-token "$GITLAB_OIDC_TOKEN"
      --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text)
    - export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" $aws_sts_output)
    - export AWS_DEFAULT_REGION="$AWS_REGION"
  script:
    - |
      if [ -z "$AWS_ROLE_ARN" ] || [ -z "$AWS_REGION" ] || [ -z "$S3_BUCKET_PROD" ]; then
        echo "Missing required CI/CD variables. Set AWS_ROLE_ARN, AWS_REGION and S3_BUCKET_PROD in Settings > CI/CD > Variables."
        exit 1
      fi
    - aws s3 sync dist/fitsync-frontend/browser/ "s3://$S3_BUCKET_PROD" --delete --cache-control "public,max-age=31536000,immutable" --exclude "index.html"
    - aws s3 cp dist/fitsync-frontend/browser/index.html "s3://$S3_BUCKET_PROD/index.html" --cache-control "no-cache,no-store,must-revalidate"
    - |
      if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
        aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
      else
        echo "CLOUDFRONT_DISTRIBUTION_ID is not set; skipping CloudFront invalidation."
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
    - when: never
