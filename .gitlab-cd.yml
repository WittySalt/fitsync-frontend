# Frontend infrastructure (Terraform) + continuous deployment to AWS S3 + CloudFront.
#
# Symmetric staging/production lanes:
#   iac     frontend_infra_staging — terraform apply the SPA S3 bucket + CloudFront
#                                     (frontend/infra/terraform/, own state)
#   deploy  deploy_staging         — s3 sync the build to the STAGING bucket
#           deploy_production      — s3 sync the build to the PRODUCTION bucket
#
# The build artifact from `build` (.gitlab-ci.yml) is reused, so no second build.
# Deploys are MANUAL and only appear on `main` pipelines.
#
# Required GitLab CI/CD variables (Settings > CI/CD > Variables):
#   AWS_ROLE_ARN                       IAM role ARN with the GitLab OIDC trust (fitsync-frontend-deploy)
#   AWS_REGION                         e.g. ap-southeast-1
#   S3_BUCKET_PROD                     production SPA bucket
#   S3_BUCKET_STAGING                  staging SPA bucket (fitsync-staging-frontend-<acct>)
#   CLOUDFRONT_DISTRIBUTION_ID         prod CloudFront id (optional; invalidation skipped if unset)
#   CLOUDFRONT_DISTRIBUTION_ID_STAGING staging CloudFront id (optional)

# Assume the deploy role via GitLab OIDC, then export AWS creds. Referenced by
# every job below so the auth boilerplate lives in exactly one place.
.aws_auth:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - apk add --no-cache bash python3 py3-pip
    - pip install --break-system-packages awscli
    - >
      aws_sts_output=$(aws sts assume-role-with-web-identity
      --role-arn "$AWS_ROLE_ARN"
      --role-session-name "gitlab-${CI_PROJECT_ID}-${CI_PIPELINE_ID}"
      --web-identity-token "$GITLAB_OIDC_TOKEN"
      --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text)
    - export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" $aws_sts_output)
    - export AWS_DEFAULT_REGION="$AWS_REGION"

# ── IaC: provision the frontend's own AWS resources (S3 + CloudFront) ─────────
frontend_infra_staging:
  stage: iac
  image: alpine:3.20
  needs: []
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  variables:
    TF_VERSION: "1.15.7"
  before_script:
    - !reference [.aws_auth, before_script]
    - apk add --no-cache curl unzip
    - curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/tf.zip
    - unzip -o /tmp/tf.zip -d /usr/local/bin
    - terraform version
  script:
    - |
      if [ -z "$AWS_ROLE_ARN" ] || [ -z "$AWS_REGION" ]; then
        echo "Missing AWS_ROLE_ARN / AWS_REGION."
        exit 1
      fi
    - cd infra/terraform
    - terraform init
    - terraform workspace select staging || terraform workspace new staging
    - terraform apply -auto-approve -var-file=staging.tfvars
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $AWS_ROLE_ARN'
      when: manual
      allow_failure: false
    - when: never

# ── Deploy: sync the built SPA to S3 (+ CloudFront invalidation) ──────────────
deploy_staging:
  stage: deploy
  image: alpine:3.20
  extends: .aws_auth
  needs:
    - job: build
      artifacts: true
  environment:
    name: staging
  script:
    - |
      if [ -z "$AWS_ROLE_ARN" ] || [ -z "$AWS_REGION" ] || [ -z "$S3_BUCKET_STAGING" ]; then
        echo "Missing required CI/CD variables. Set AWS_ROLE_ARN, AWS_REGION and S3_BUCKET_STAGING."
        exit 1
      fi
    - aws s3 sync dist/fitsync-frontend/browser/ "s3://$S3_BUCKET_STAGING" --delete --cache-control "public,max-age=31536000,immutable" --exclude "index.html"
    - aws s3 cp dist/fitsync-frontend/browser/index.html "s3://$S3_BUCKET_STAGING/index.html" --cache-control "no-cache,no-store,must-revalidate"
    - |
      if [ -n "$CLOUDFRONT_DISTRIBUTION_ID_STAGING" ]; then
        aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID_STAGING" --paths "/*"
      else
        echo "CLOUDFRONT_DISTRIBUTION_ID_STAGING is not set; skipping CloudFront invalidation."
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
    - when: never

deploy_production:
  stage: deploy
  image: alpine:3.20
  extends: .aws_auth
  needs:
    - job: build
      artifacts: true
  environment:
    name: production
    url: https://d26vi6hikexzev.cloudfront.net
  script:
    - |
      if [ -z "$AWS_ROLE_ARN" ] || [ -z "$AWS_REGION" ] || [ -z "$S3_BUCKET_PROD" ]; then
        echo "Missing required CI/CD variables. Set AWS_ROLE_ARN, AWS_REGION and S3_BUCKET_PROD in Settings > CI/CD > Variables."
        exit 1
      fi
    - aws s3 sync dist/fitsync-frontend/browser/ "s3://$S3_BUCKET_PROD" --delete --cache-control "public,max-age=31536000,immutable" --exclude "index.html"
    - aws s3 cp dist/fitsync-frontend/browser/index.html "s3://$S3_BUCKET_PROD/index.html" --cache-control "no-cache,no-store,must-revalidate"
    - |
      if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
        aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
      else
        echo "CLOUDFRONT_DISTRIBUTION_ID is not set; skipping CloudFront invalidation."
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
    - when: never
