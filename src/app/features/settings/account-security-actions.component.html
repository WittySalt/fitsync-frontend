<article class="sub-card account-security-actions">
  <div class="sub-card-header">
    <div>
      <h3>Account security actions</h3>
      <p>These actions use your active Cognito session.</p>
    </div>
  </div>

  <form class="security-form" [formGroup]="passwordForm" (ngSubmit)="changePassword()">
    <h4>Change password</h4>
    <label>
      Current password
      <input type="password" autocomplete="current-password" formControlName="currentPassword" />
      @if (currentPasswordInvalid()) {
        <span class="field-error">Current password is required.</span>
      }
    </label>
    <label>
      New password
      <input type="password" autocomplete="new-password" formControlName="newPassword" />
      @if (newPasswordInvalid()) {
        <span class="field-error">Use at least 8 characters with letters and numbers.</span>
      }
    </label>
    <label>
      Confirm new password
      <input type="password" autocomplete="new-password" formControlName="confirmPassword" />
      @if (confirmPasswordInvalid()) {
        <span class="field-error">Passwords must match.</span>
      }
    </label>
    <div class="action-row">
      <button class="button primary" type="submit" [disabled]="changingPassword()">
        {{ changingPassword() ? 'Changing...' : 'Change password' }}
      </button>
    </div>
  </form>

  @if (showSignOutEverywhere) {
    <div class="security-action-list">
      <div>
        <strong>Sign out everywhere</strong>
        <p>This signs you out on every device, including this one.</p>
      </div>
      @if (confirmingSignOut()) {
        <div class="confirm-row" role="group" aria-labelledby="confirm-sign-out-question">
          <p id="confirm-sign-out-question">Sign out everywhere, including this device?</p>
          <div class="confirm-actions">
            <button #confirmSignOut class="button danger-solid" type="button" [disabled]="signingOut()" (click)="signOutEverywhere()">
              {{ signingOut() ? 'Signing out...' : 'Sign out everywhere' }}
            </button>
            <button class="button secondary" type="button" [disabled]="signingOut()" (click)="confirmingSignOut.set(false)">Cancel</button>
          </div>
        </div>
      } @else {
        <button class="button secondary danger-text" type="button" (click)="confirmingSignOut.set(true)">Sign out everywhere</button>
      }
    </div>
  }

</article>
