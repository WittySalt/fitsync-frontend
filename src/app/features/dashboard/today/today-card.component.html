<section class="today" aria-labelledby="today-title">
  <header class="head">
    <h2 class="eyebrow" id="today-title">Today</h2>
    <a class="more" routerLink="/progress/goal">Body and goals ›</a>
  </header>

  @if (loading()) {
    <div class="skeleton panel-skeleton" aria-hidden="true"></div>
  } @else {
    <div class="panel" id="today-panel-food" [attr.aria-busy]="foodLoading() && !foodFailed()">
      @if (foodFailed()) {
        <div class="failed">
          <p>This could not be loaded.</p>
          <button type="button" class="retry" (click)="retryFood()">Try again</button>
        </div>
      } @else if (foodLoading()) {
        <div class="skeleton panel-skeleton" aria-hidden="true"></div>
      } @else {
        @if (nutrition(); as summary) {
          <app-today-food
            [nutrition]="summary"
            [meals]="foodMeals()"
            [now]="now()"
            [usual]="usualMeals()"
            [busy]="logging()"
            (logUsual)="logUsual($event)"
          />
        }
      }
    </div>
  }
</section>
