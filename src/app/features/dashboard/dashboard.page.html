<div class="page-grid dashboard-page">
  @if (data()?.profile?.onboardingCompleted === false) {
    <header class="page-header">
      <a class="button primary" routerLink="/onboarding">Complete setup</a>
    </header>
  }

  @if (loading()) {
    <div class="summary-card skeleton tall"></div>
    <div class="summary-card skeleton"></div>
    <div class="summary-card skeleton"></div>
  } @else if (error()) {
    <app-state-panel
      title="Dashboard unavailable"
      [message]="error() ?? ''"
      actionLabel="Retry"
      [error]="true"
      (action)="load()"
    />
  } @else if (data(); as dashboard) {
    <app-coach-brief
      [firstName]="dashboard.profile.firstName"
      [displayName]="dashboard.profile.displayName"
      [timezone]="dashboard.profile.timezone"
      [caloriesTarget]="nutritionSummary()?.targetCalories ?? null"
      [focusAreas]="dashboard.profile.focusAreas ?? []"
      [goals]="dashboard.goals"
    />

    <app-today-card
      [dashboard]="dashboard"
      [nutrition]="nutritionSummary()"
      [nutritionFailed]="nutritionFailed()"
      (retryDashboard)="load()"
      (retryNutrition)="loadNutrition()"
    />

    <app-earned
      [timezone]="dashboard.profile.timezone"
      [minutesThisWeek]="dashboard.workout?.minutesThisWeek ?? null"
      [streakDays]="dashboard.workout?.currentStreakDays ?? null"
    />
  }
</div>
