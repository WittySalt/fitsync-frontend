<div class="page-grid nutrition-page">
  <header class="page-header nutrition-header">
    <div>
      <h1>Nutrition</h1>
      <p class="head-line">{{ headLine() }}</p>
    </div>
  </header>

  @if (tab() === 'diary') {
    <app-insight-panel surface="NUTRITION" />

    @if (range().status === 'loading') {
      <div class="skeleton week-skeleton" aria-busy="true"></div>
    } @else {
      <app-diary-week
        [days]="days()"
        [dates]="dates"
        [today]="today"
        [selected]="selectedDate()"
        [target]="targetCalories()"
        [failed]="range().status === 'error'"
        (pick)="showDay($event)"
        (retry)="loadRange()"
      />
    }
  }

  <div class="segmented nutrition-tabs" role="tablist" aria-label="Nutrition sections">
    <button
      id="nutrition-tab-diary"
      type="button"
      role="tab"
      [class.active]="tab() === 'diary'"
      [attr.aria-selected]="tab() === 'diary'"
      aria-controls="nutrition-panel-diary"
      (click)="setTab('diary')"
    >
      Diary
    </button>
    <button
      id="nutrition-tab-recipes"
      type="button"
      role="tab"
      [class.active]="tab() === 'recipes'"
      [attr.aria-selected]="tab() === 'recipes'"
      aria-controls="nutrition-panel-recipes"
      (click)="setTab('recipes')"
    >
      Recipes
    </button>
  </div>

  @if (tab() === 'recipes') {
    <section id="nutrition-panel-recipes" role="tabpanel" aria-labelledby="nutrition-tab-recipes">
      <app-recipes-tab [section]="recipeSection()" [logTo]="logTo()" (cancelLog)="logTo.set(null)" />
    </section>
  } @else if (view() === 'diary') {
    <section id="nutrition-panel-diary" role="tabpanel" aria-labelledby="nutrition-tab-diary">
      <app-diary-day
        [date]="selectedDate()"
        [dates]="dates"
        [today]="today"
        [days]="days()"
        [refresh]="refresh()"
        (changed)="refreshRange()"
        (addMeal)="startLog($event)"
        (addFrom)="startFrom($event)"
      />
    </section>
  } @else {
    <section id="nutrition-panel-log" class="nutrition-workspace" aria-label="Log a meal">
      <div class="log-head">
        <h2>Log a meal</h2>
        <button class="button secondary" type="button" (click)="backToDiary()">Back to the Diary</button>
      </div>
      <app-meal-builder (saved)="refreshAfterMealSave()" />
    </section>
  }
</div>
