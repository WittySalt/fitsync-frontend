<section class="summary-card analytics-chart-filters" aria-label="Workout and nutrition trends">
  <div class="section-title">
    <div>
      <span class="card-label">Analytics</span>
      <h2>Workout and nutrition trends</h2>
    </div>
    <span class="date-caption">{{ rangeText() }}</span>
  </div>

  <div class="bucket-toggle" role="group" aria-label="Group the days by">
    @for (option of bucketOptions; track option.value) {
      <button
        type="button"
        [class.active]="selectedBucket() === option.value"
        [attr.aria-pressed]="selectedBucket() === option.value"
        (click)="selectBucket(option.value)"
      >
        {{ option.label }}
      </button>
    }
  </div>
</section>

@if (loading()) {
  <section class="trend-chart-grid" aria-busy="true" aria-label="Loading analytics trends">
    <div class="summary-card skeleton tall"></div>
    <div class="summary-card skeleton tall"></div>
  </section>
} @else if (error()) {
  <app-state-panel
    title="Analytics trends unavailable"
    [message]="error() ?? ''"
    actionLabel="Retry"
    [error]="true"
    (action)="load()"
  />
} @else if (!hasSeriesData()) {
  <app-state-panel
    title="No workout or nutrition trends"
    message="Log workouts and meals to see trend charts for the selected range."
  />
} @else {
  <section class="trend-chart-grid" aria-label="Workout and nutrition trend charts">
    <article class="summary-card trend-chart-card">
      <div class="section-title">
        <div>
          <span class="card-label">Workout</span>
          <h3>Sessions, minutes and calories burned</h3>
        </div>
      </div>
      <fs-chart
        type="bar"
        [compact]="true"
        [wholeNumbers]="true"
        [labels]="chartLabels()"
        [series]="sessionsSeries()"
        yAxisLabel="Sessions"
        [ariaLabel]="'Sessions per period, ' + rangeText()"
      />
      <fs-chart
        [compact]="true"
        [labels]="chartLabels()"
        [series]="minutesSeries()"
        yAxisLabel="Minutes"
        [ariaLabel]="'Training minutes per period, ' + rangeText()"
      />
      <fs-chart
        [compact]="true"
        [labels]="chartLabels()"
        [series]="caloriesBurnedSeries()"
        yAxisLabel="kcal burned"
        [ariaLabel]="'Calories burned per period, ' + rangeText()"
      />
    </article>

    <article class="summary-card trend-chart-card">
      <div class="section-title">
        <div>
          <span class="card-label">Nutrition</span>
          <h3>Protein, carbs and fat</h3>
        </div>
      </div>
      <fs-chart
        [labels]="chartLabels()"
        [series]="nutritionSeries()"
        yAxisLabel="Grams"
        [ariaLabel]="'Protein, carbs and fat per period, ' + rangeText()"
      />
    </article>
  </section>
}
