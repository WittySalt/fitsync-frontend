<div class="progress-page">
  <header class="head">
    <span class="eyebrow">Progress</span>
    <h1>Is it working?</h1>
    <p>{{ periodLabel }}</p>
  </header>

  <app-jump-bar [items]="sections" [active]="active()" label="Sections of Progress" (chosen)="jump($event)" />

  <section id="progress-summary" class="anchor" aria-label="Summary">
    <app-insight-panel surface="PROGRESS" (factChosen)="showCard($event)" />
  </section>

  <div id="progress-goal" class="anchor">
    <app-goal-card [period]="goalPeriod" [askPeriod]="fourWeeks" [factNumber]="factNumbers().GOAL ?? null" [ringed]="ringed() === 'GOAL'" />
  </div>

  <div id="progress-training" class="anchor training" [class.ringed]="ringed() === 'TRAINING'">
    <app-training-card [from]="fourWeeks.from" [to]="fourWeeks.to" [citation]="factNumbers().TRAINING ?? null" />
  </div>

  <div id="progress-food" class="anchor">
    <app-food-card [period]="foodPeriod" [factNumber]="factNumbers().FOOD ?? null" [ringed]="ringed() === 'FOOD'" />
  </div>

  <div id="progress-reviews" class="anchor">
    <app-reviews-card [today]="today" />
  </div>
</div>
