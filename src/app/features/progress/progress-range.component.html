<div class="bar">
  <div class="presets" role="group" aria-label="Time range">
    @for (preset of presets; track preset.days) {
      <button type="button" [class.active]="activeDays() === preset.days" [attr.aria-pressed]="activeDays() === preset.days" (click)="presetChosen.emit(preset.days)">
        {{ preset.label }}
      </button>
    }
  </div>
  <span class="caption">{{ caption() }}</span>
  <button type="button" class="more" [attr.aria-expanded]="moreOpen()" aria-controls="progress-range-more" (click)="toggleMore()">More</button>
</div>

@if (moreOpen()) {
  <div class="custom" id="progress-range-more">
    <label>
      Start
      <input type="date" [value]="from()" (change)="from.set($any($event.target).value)" />
    </label>
    <label>
      End
      <input type="date" [value]="to()" (change)="to.set($any($event.target).value)" />
    </label>
    <button type="button" class="button secondary" [disabled]="invalid() || !from() || !to()" (click)="apply()">Apply</button>
    @if (invalid()) {
      <p class="problem" role="alert">The start has to come before the end.</p>
    }
  </div>
}
