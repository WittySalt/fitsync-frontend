<app-detail-layout>
  @if (data()) {
    <app-detail-head detailHead surface="progress-goal" [eyebrow]="eyebrow()" [verdict]="verdict().text" [tone]="verdict().tone" [sentence]="sentence()" [stats]="stats()">
      <app-ink-switch headPeriod label="Period" [options]="periodOptions" [value]="period.code()" (picked)="choosePeriod($event)" />
    </app-detail-head>
  }
  @if (data()) {
    <app-contents-rail detailRail tour="progress-goal" [items]="sections" label="Sections of the Goal page" />
  }
  @if (data(); as goal) {
    <app-highlights [highlights]="goal.highlights" [context]="context()" />

    <app-detail-section name="Weight" tour="progress-goal" anchor="weight" [sentence]="weightLine()" [context]="context()" [ask]="weightPrompt()">
      <app-ink-switch sectionControl label="How far back the chart goes" [options]="rangeOptions" [value]="range()" (picked)="chooseRange($event)" />
      <div [attr.aria-busy]="loading()">
        <app-goal-weight-chart [weight]="weight() ?? goal.weight" [goal]="goal.goal" [today]="today" [since]="weightWindow().from" [height]="280" />
      </div>
      <div class="legend">
        <span><i class="dot"></i>A weigh-in</span>
        <span><i class="line"></i>Weekly average</span>
        <span><i class="dash"></i>At this pace</span>
        <span><i class="dash goal"></i>Goal</span>
      </div>
    </app-detail-section>

    <app-goal-body-section [body]="goal.body" [sentence]="bodyLine()" [context]="context()" />

    <app-detail-section name="Pace" anchor="pace" [sentence]="paceLine()" [context]="context()" [ask]="paceAsk">
      <app-pace-chart [weeks]="goal.pace.weeks" [height]="200" />
      <div class="legend">
        <span><i class="dash"></i>Expected from your food log</span>
        <span><i class="line slate"></i>On the scale</span>
      </div>
    </app-detail-section>

    <app-goal-other-goals [goals]="goal.otherGoals" [from]="otherWindow().from" [to]="otherWindow().to" [context]="context()" />
  } @else if (failed()) {
    <app-state-panel title="Your goal could not be loaded" message="Nothing is lost. Try again in a moment." actionLabel="Try again" [error]="true" (action)="load()" />
  } @else {
    <div class="skeleton block" aria-busy="true" aria-label="Loading your goal"></div>
    <div class="skeleton block tall" aria-hidden="true"></div>
  }
</app-detail-layout>
