@for (group of rows().controls; track group; let rowIndex = $index) {
  <div class="exercise-row" [formGroup]="group">
    @if (pickerState(rowIndex); as picker) {
      <label class="exercise-picker-label">
        Exercise
        <div class="exercise-typeahead">
          <input
            #exerciseSearch
            type="text"
            autocomplete="off"
            role="combobox"
            aria-autocomplete="list"
            [value]="picker.inputValue"
            [attr.aria-expanded]="picker.open"
            [attr.aria-controls]="listboxId(rowIndex)"
            [attr.aria-activedescendant]="activeOptionId(rowIndex)"
            [attr.aria-invalid]="group.controls.exerciseId.invalid && group.controls.exerciseId.touched"
            placeholder="Search exercises"
            (focus)="openPicker(rowIndex)"
            (blur)="markTouched(rowIndex); closePicker(rowIndex)"
            (input)="setSearchQuery(rowIndex, exerciseSearch.value)"
            (keydown)="handleKeydown($event, rowIndex)"
          />
          @if (picker.open) {
            <div
              class="exercise-typeahead-panel"
              [id]="listboxId(rowIndex)"
              role="listbox"
              [attr.aria-label]="'Exercise search results for row ' + (rowIndex + 1)"
            >
              @if (picker.loading) {
                <output class="typeahead-status" aria-live="polite">Searching exercises...</output>
              } @else if (picker.error) {
                <output class="typeahead-status error" aria-live="assertive">{{ picker.error }}</output>
              } @else if (picker.results.length) {
                @for (exercise of picker.results; track exercise.exerciseId ?? exercise.name; let optionIndex = $index) {
                  @if (exercise.exerciseId) {
                    <div
                      class="typeahead-option"
                      [id]="optionId(rowIndex, optionIndex)"
                      role="option"
                      tabindex="-1"
                      [class.active]="picker.activeIndex === optionIndex"
                      [attr.aria-selected]="picker.activeIndex === optionIndex"
                      (mousedown)="$event.preventDefault()"
                      (click)="selectResult(rowIndex, exercise)"
                      (keydown.enter)="selectResult(rowIndex, exercise)"
                      (keydown.space)="selectResult(rowIndex, exercise)"
                    >
                      <strong>{{ exercise.name }}</strong>
                      <small>{{ exerciseHint(exercise) }}</small>
                    </div>
                  }
                }
              } @else if (picker.query) {
                <output class="typeahead-status" aria-live="polite">No exercises found.</output>
              } @else {
                <output class="typeahead-status">Type to search exercises.</output>
              }
            </div>
          }
        </div>
        @if (group.controls.exerciseId.invalid && group.controls.exerciseId.touched) {
          <span class="field-error">Choose an exercise.</span>
        }
      </label>
    }
    @if (isTimedRow(rowIndex)) {
      <label>
        Duration sec
        <input formControlName="targetDurationSeconds" type="number" min="0" inputmode="numeric" placeholder="e.g. 60" />
      </label>
    } @else {
      <label>
        Sets
        <input formControlName="targetSets" type="number" min="0" inputmode="numeric" />
      </label>
      <label>
        Reps
        <input formControlName="targetReps" type="number" min="0" inputmode="numeric" />
      </label>
      <label>
        Weight kg
        <input formControlName="targetWeightKg" type="number" min="0" step="0.5" inputmode="decimal" />
      </label>
      <label>
        Tempo sec
        <input
          formControlName="tempoSeconds"
          type="number"
          min="1"
          max="10"
          step="0.5"
          inputmode="decimal"
          [placeholder]="tempoPlaceholder(rowIndex)"
        />
        @if (group.controls.tempoSeconds.invalid) {
          <span class="field-error">1 to 10 seconds.</span>
        }
      </label>
    }
    <label>
      Rest sec
      <input formControlName="restSeconds" type="number" min="0" inputmode="numeric" />
    </label>
    <label class="wide">
      Notes
      <input formControlName="notes" type="text" maxlength="300" autocomplete="off" />
    </label>
    <button class="button secondary" type="button" (click)="removeRow.emit(rowIndex)">Remove</button>
  </div>
}
