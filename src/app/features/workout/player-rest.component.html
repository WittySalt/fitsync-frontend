<app-player-stage [centred]="true">
  <app-exercise-picture
    slot="pic"
    variant="hero"
    [url]="exercise().imageUrl"
    [alt]="exercise().alt"
    [initial]="exercise().initial"
    [caption]="exercise().caption"
    [frames]="exercise().frameCount"
    [frame]="exercise().frame"
    (opened)="howTo.emit()"
    (failed)="imageFailed.emit()"
  />
  <div slot="main" class="rest-main">
    <app-player-ring [share]="share()" [centre]="clock()" caption="Rest" tone="slate" [urgent]="urgent()" [label]="'Rest, ' + clock() + ' left'" [reducedMotion]="reducedMotion()" />
    <div class="buttons">
      <button type="button" class="quiet" (click)="addTime.emit()">+15 sec</button>
      <button type="button" class="quiet" data-primary (click)="skip.emit()">Skip rest</button>
    </div>
    <div class="what">
      <span class="kicker">{{ kicker() }}</span>
      @if (nextName()) {
        <strong class="name">{{ nextName() }}</strong>
      }
      <span class="line">{{ line() }}</span>
    </div>
  </div>
  <app-step-carousel
    slot="steps"
    [steps]="exercise().steps"
    [(index)]="stepIndex"
    [(reading)]="reading"
    [reducedMotion]="reducedMotion()"
    [paused]="holdSteps()"
    (howTo)="howTo.emit()"
  />
  @if (coachLine()) {
    <div slot="extra" class="coach">
      <span class="mark" aria-hidden="true">C</span>
      <span class="said">{{ coachLine() }}</span>
      <button type="button" class="ask" (click)="ask.emit()">Ask</button>
    </div>
  }
</app-player-stage>
