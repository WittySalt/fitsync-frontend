@if (shown()) {
  @let bar = view();
  <div class="bar" [class.leaving]="leaving()">
    <button class="resume" type="button" [attr.aria-label]="accessibleName()" [tabindex]="leaving() ? -1 : 0" (click)="resume()">
      <span class="dot" [class.paused]="bar?.paused" aria-hidden="true"></span>
      <span class="name">{{ bar?.name }}</span>
      <span class="time" aria-hidden="true">{{ bar?.time }}</span>
      @if (bar?.step; as step) {
        <span class="step" aria-hidden="true">{{ step }}</span>
      }
    </button>
    <button class="end" type="button" [tabindex]="leaving() ? -1 : 0" (click)="openEnd()">End</button>
  </div>
}

@if (ending()) {
  <app-workout-modal heading="End this workout" (dismissed)="keepGoing()">
    @if (confirmingDiscard()) {
      <p class="ask">Discard this workout? {{ discardText() }}</p>
      <div class="choices">
        @if (live.doneSetCount() > 0) {
          <button class="button primary" type="button" [disabled]="busy()" (click)="finishAndSave()">Finish and save</button>
        }
        <button class="button danger-solid" type="button" [disabled]="busy()" (click)="discard()">Discard</button>
        <button class="button secondary" type="button" [disabled]="busy()" (click)="keepGoing()">Keep going</button>
      </div>
    } @else {
      <div class="choices">
        <button class="button primary" type="button" [disabled]="busy()" (click)="finishAndSave()">Finish and save</button>
        <button class="button secondary danger-text" type="button" [disabled]="busy()" (click)="confirmingDiscard.set(true)">Discard workout</button>
        <button class="button secondary" type="button" [disabled]="busy()" (click)="keepGoing()">Keep going</button>
      </div>
    }
  </app-workout-modal>
}
