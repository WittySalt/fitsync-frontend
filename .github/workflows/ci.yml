# CI: lint, test, build.
# Runs on pull requests and pushes to main/develop. Secret detection runs here via
# gitleaks, and static analysis (SAST) runs here via Semgrep in the sast job.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:v8.24.2
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks container runs as root; allow the differently-owned checkout.
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory '*'
      - run: gitleaks detect --source . --verbose --redact

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@v4
      # The container runs as root; let git list the differently-owned checkout, so
      # Semgrep scans the tracked files only.
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Every severity goes into the reports. p/typescript already carries the Angular
      # rules (typescript.angular.*); the registry has no separate Angular pack.
      - name: Semgrep scan
        run: >-
          semgrep scan
          --config p/javascript
          --config p/typescript
          --config p/owasp-top-ten
          --config p/secrets
          --metrics=off
          --json --output semgrep.json
          --sarif-output=semgrep.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: semgrep-report
          path: |
            semgrep.json
            semgrep.sarif
          retention-days: 30
          if-no-files-found: warn
      # Only ERROR findings fail the job. WARNING and INFO findings stay in the report.
      - name: Fail on ERROR findings
        run: |
          jq -r '.results[] | select(.extra.severity == "ERROR") | "\(.path):\(.start.line) \(.check_id)"' semgrep.json
          errors=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep.json)
          echo "Semgrep ERROR findings: $errors"
          test "$errors" -eq 0

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  unit-test:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: ng test (headless Chrome + coverage)
        env:
          # ubuntu-latest ships google-chrome; the ChromeHeadlessNoGpu launcher in
          # karma.conf.js already passes --no-sandbox / --disable-gpu for CI.
          CHROME_BIN: /usr/bin/google-chrome
        run: npx ng test --watch=false --browsers=ChromeHeadlessNoGpu --code-coverage
      # Non-fatal: an artifact-quota hiccup must not fail an otherwise green build.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: coverage
          path: coverage/
          retention-days: 5
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build -- --configuration production
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: dist
          path: dist/fitsync-frontend/
          retention-days: 5

  sonar:
    # SonarCloud analysis with the unit-test coverage, using the same scanner image as the
    # GitLab pipeline did. Skipped quietly until SONAR_TOKEN is configured.
    runs-on: ubuntu-latest
    needs: unit-test
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_QUALITYGATE_WAIT: ${{ vars.SONAR_QUALITYGATE_WAIT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: env.SONAR_TOKEN != ''
        with:
          name: coverage
          path: coverage/
      - name: sonar-scanner
        if: env.SONAR_TOKEN != ''
        run: |
          docker run --rm -e SONAR_TOKEN -v "$PWD:/usr/src" -w /usr/src sonarsource/sonar-scanner-cli:11             -Dsonar.host.url="${SONAR_HOST_URL:-https://sonarcloud.io}"             -Dsonar.projectKey="$SONAR_PROJECT_KEY"             -Dsonar.organization="$SONAR_ORGANIZATION"             -Dsonar.qualitygate.wait="${SONAR_QUALITYGATE_WAIT:-true}"
