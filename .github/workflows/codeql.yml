# SAST via GitHub CodeQL (replaces the GitLab Security/SAST.gitlab-ci.yml template).
# Scans the JavaScript/TypeScript sources and reports findings under the repo's
# Security → Code scanning tab.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 3 * * 1"   # weekly, Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
