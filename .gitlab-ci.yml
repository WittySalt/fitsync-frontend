include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - local: .gitlab-cd.yml

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - when: never

stages:
  - lint
  - test
  - build
  - secret-detection
  - deploy

variables:
  NODE_VERSION: "20"
  SECRET_DETECTION_ENABLED: "true"

default:
  image: node:20
  interruptible: true
  cache:
    key: "node-$CI_COMMIT_REF_SLUG"
    paths:
      - node_modules/

typecheck:
  stage: lint
  script:
    - npm ci
    - npx tsc --noEmit
  rules:
    - exists:
        - package.json

eslint:
  stage: lint
  script:
    - npm ci
    - npm run lint
  rules:
    - exists:
        - package.json

unit_test:
  stage: test
  needs: ["typecheck"]
  before_script:
    - apt-get update
    - apt-get install -y chromium
    - export CHROME_BIN=/usr/bin/chromium
  script:
    - npm ci
    - npx ng test --watch=false --browsers=ChromeHeadlessNoGpu --code-coverage
  artifacts:
    when: always
    expire_in: 5 days
    paths:
      - coverage/
  rules:
    - exists:
        - package.json

sonarqube:
  stage: test
  needs: ["unit_test"]
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "sonar-$CI_COMMIT_REF_SLUG"
    paths:
      - .sonar/cache
  script:
    # Publishes code smells / coverage / duplication / hotspots and blocks on the
    # Quality Gate. Stays off until SONAR_TOKEN is configured (pipeline green by default).
    - >
      sonar-scanner
      -Dsonar.host.url="${SONAR_HOST_URL:-https://sonarcloud.io}"
      -Dsonar.token="$SONAR_TOKEN"
      -Dsonar.projectKey="$SONAR_PROJECT_KEY"
      -Dsonar.organization="$SONAR_ORGANIZATION"
      -Dsonar.qualitygate.wait="${SONAR_QUALITYGATE_WAIT:-true}"
  rules:
    - if: '$SONAR_TOKEN && ($CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "main")'
    - when: never

build:
  stage: build
  needs: ["unit_test"]
  script:
    - npm ci
    - npm run build -- --configuration production
  artifacts:
    when: on_success
    expire_in: 5 days
    paths:
      - dist/fitsync-frontend/
  rules:
    - exists:
        - package.json

secret_detection:
  stage: secret-detection
  rules:
    - exists:
        - package.json
