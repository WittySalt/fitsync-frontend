include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - when: never

stages:
  - lint
  - test
  - build
  - secret-detection
  - deploy

variables:
  NODE_VERSION: "20"
  SECRET_DETECTION_ENABLED: "true"

default:
  image: node:20
  interruptible: true
  cache:
    key: "node-$CI_COMMIT_REF_SLUG"
    paths:
      - node_modules/

typecheck:
  stage: lint
  script:
    - npm ci
    - npx tsc --noEmit
  rules:
    - exists:
        - package.json

unit_test:
  stage: test
  needs: ["typecheck"]
  before_script:
    - apt-get update
    - apt-get install -y chromium
    - export CHROME_BIN=/usr/bin/chromium
  script:
    - npm ci
    - npx ng test --watch=false --browsers=ChromeHeadlessNoGpu --code-coverage
  artifacts:
    when: always
    expire_in: 5 days
    paths:
      - coverage/
  rules:
    - exists:
        - package.json

build:
  stage: build
  needs: ["unit_test"]
  script:
    - npm ci
    - npm run build -- --configuration production
  artifacts:
    when: on_success
    expire_in: 5 days
    paths:
      - dist/
  rules:
    - exists:
        - package.json

sast:
  stage: test

secret_detection:
  stage: secret-detection

deploy_s3:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: build
      artifacts: true
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - apk add --no-cache bash python3 py3-pip
    - pip install --break-system-packages awscli
    - >
      aws_sts_output=$(aws sts assume-role-with-web-identity
      --role-arn "$AWS_ROLE_ARN"
      --role-session-name "gitlab-${CI_PROJECT_ID}-${CI_PIPELINE_ID}"
      --web-identity-token "$GITLAB_OIDC_TOKEN"
      --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text)
    - export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" $aws_sts_output)
    - export AWS_DEFAULT_REGION="$AWS_REGION"
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        export TARGET_BUCKET="$S3_BUCKET_PROD"
      else
        export TARGET_BUCKET="$S3_BUCKET_STAGING"
      fi
    - aws s3 sync dist/ "s3://$TARGET_BUCKET" --delete --cache-control "public,max-age=31536000,immutable" --exclude "index.html"
    - aws s3 cp dist/index.html "s3://$TARGET_BUCKET/index.html" --cache-control "no-cache,no-store,must-revalidate"
    - aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*" || true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")'
      exists:
        - package.json
    - when: never
