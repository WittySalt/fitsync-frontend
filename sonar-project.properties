# SonarQube / SonarCloud analysis config for the FitSync frontend.
# projectKey / organization / host / token are supplied by CI/CD variables
# (SONAR_PROJECT_KEY, SONAR_ORGANIZATION, SONAR_HOST_URL, SONAR_TOKEN).

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/*.config.js,**/environments/**
sonar.coverage.exclusions=**/*.spec.ts,**/main.ts,**/environments/**,**/*.module.ts
sonar.cpd.exclusions=**/*.spec.ts
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.spec.ts
# The workout plan typeahead uses the APG combobox/listbox pattern; no native datalist/select equivalent supports this async result UI.
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.e2.resourceKey=src/app/features/workout/workout.page.html

# Coverage produced by `ng test --code-coverage` (karma lcovonly reporter).
sonar.javascript.lcov.reportPaths=coverage/fitsync-frontend/lcov.info

sonar.sourceEncoding=UTF-8
